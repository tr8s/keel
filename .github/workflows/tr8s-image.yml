# Publishes Keel with the private approval channel fix (keel-hq/keel#209) as a
# public image for the tr8s cluster. Lives only on this fork's tr8s branch; the
# fix itself goes upstream from fix/slack-private-approval-channels. Retire the
# branch once a Keel release contains the fix.
name: tr8s image

on:
  push:
    branches: [tr8s]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tr8s
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:0.22.3-tr8s.3
            ghcr.io/${{ github.repository }}:tr8s-${{ github.sha }}
